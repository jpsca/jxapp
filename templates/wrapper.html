<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Apply dark mode immediately to prevent flash
  if (localStorage.getItem('theme') === 'dark' ||
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel=icon href="/static/favicon.ico" sizes=any>
<link rel=icon href="/static/favicon.svg" type="image/svg+xml">
<title>{{ title | safe }}</title>
<script type="importmap">{"imports": {"@hotwired/stimulus": "/static/stimulus.js", "@hotwired/turbo": "/static/turbo.js"}}</script>
<link rel="stylesheet" href="/static/tailwind.css">
<script type="module" src="/static/turbo.js"></script>
<script type="module" src="/static/app.js"></script>
<link rel="stylesheet" href="/static/app.css">
{{ css | safe }}
</head>
<body class="dark:bg-zinc-900 dark:text-zinc-100">
<nav class="bg-zinc-100 dark:bg-zinc-800 border-b border-zinc-200 dark:border-zinc-700 px-4 py-2 text-sm flex items-center justify-between">
  <a href="/" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">&larr; Components</a>
  <label class="inline-flex items-center cursor-pointer gap-2">
    <svg width="20" height="20" class="w-4 h-4 text-zinc-500 dark:text-zinc-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
    <div class="relative">
      <input id="dark-mode-toggle" type="checkbox" class="sr-only peer">
      <div class="w-9 h-5 bg-zinc-300 peer-checked:bg-blue-600 rounded-full transition-colors"></div>
      <div class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-4"></div>
    </div>
    <svg width="20" height="20" class="w-4 h-4 text-zinc-500 dark:text-zinc-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
  </label>
</nav>
<main class="p-10 mb-10 mx-auto space-y-10 max-w-4xl">
{{ content | safe }}
</main>
{{ js | safe }}
</body>
</html>
